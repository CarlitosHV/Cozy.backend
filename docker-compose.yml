version: '3.8'

services:
  # Contenedor de la API (Node.js + Express + Socket.io)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cozyleap_api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - NODE_ENV=production
    extra_hosts:
      # Permite conectar a puertos del host con host.docker.internal si las bases exponen puertos
      - "host.docker.internal:host-gateway"
    networks:
      - dokploy-network

volumes:
  api_data:
    driver: local

# Red interna que utiliza Dokploy para comunicar sus contenedores
networks:
  dokploy-network:
    external: true
